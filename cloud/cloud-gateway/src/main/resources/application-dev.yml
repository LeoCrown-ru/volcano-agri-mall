server:
  port: 8080

spring:
  application:
    name: cloud-gateway
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  redis:
    host: 127.0.0.1
    port: 6379
    password: 
    database: 15
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        enabled: false
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        - id: cloud-auth
          uri: lb://cloud-auth
          predicates:
            - Path=/auth/**
          filters:
            - CacheRequestFilter
            - StripPrefix=1
        - id: cloud-gen
          uri: lb://cloud-gen
          predicates:
            - Path=/code/**
          filters:
            - StripPrefix=1
        - id: cloud-job
          uri: lb://cloud-job
          predicates:
            - Path=/schedule/**
          filters:
            - StripPrefix=1
        - id: cloud-system
          uri: lb://cloud-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        - id: cloud-file
          uri: lb://cloud-file
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
        - id: cloud-ums
          uri: lb://cloud-ums
          predicates:
            - Path=/ums/**
          filters:
            - StripPrefix=1
        - id: cloud-cms
          uri: lb://cloud-cms
          predicates:
            - Path=/cms/**
          filters:
            - StripPrefix=1
        - id: cloud-oms
          uri: lb://cloud-oms
          predicates:
            - Path=/oms/**
          filters:
            - StripPrefix=1

security:
  captcha:
    enabled: true
    type: math
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
      - /cms/content
  ignore:
    whites:
      - /auth/logout
      - /auth/login
      - /auth/register
      - /*/v2/api-docs
      - /csrf
      - /ums/login
      - /ums/register
      - /ums/recommend/**
      - /travel/front/**
      - /hotel/front/**
      - /system/file/upload